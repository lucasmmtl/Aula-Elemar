<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Lucas Matheus Matos de Lima" />
    <meta name="description" content="Formulário de contato" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Contato</title>
  </head>
  <body>
    <header>
      <h1>Contato</h1>
      <p>Entre em contato comigo</p>
    </header>

    <main>
      <form action="#" method="post">
        <label for="nome">Nome:</label>
        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Seu nome"
          required
        />

        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Seu email"
          required
        />

        <label for="mensagem">Mensagem:</label>
        <textarea
          id="mensagem"
          name="mensagem"
          placeholder="Escreva sua mensagem"
          required
        ></textarea>

        <button type="submit">Enviar</button>
      </form>
    </main>

    <footer>
      <p>Lucas Matheus Matos de Lima</p>
    </footer>
  </body>
</html>
